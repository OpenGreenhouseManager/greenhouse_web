<div class="component">
  <p-card [style]="cardStyle()" [styleClass]="solid() ? 'grn-card-solid' : 'grn-card-tinted'">
    <ng-template pTemplate="header">
      <div class="header p-1">
        <h1 class="w-full text-2xl {{ centerTitle() ? 'text-center' : '' }}">
          {{ title() }}
        </h1>
        <i
          [class]="icon_class()"
          class="gridster-item-content"
          (click)="iconClicked.emit()"></i>
      </div>
    </ng-template>
    <ng-template pTemplate="content">
      <div class="content gridster-item-content p-1">
        <ng-content styleClass="card-content"></ng-content>
      </div>
    </ng-template>
  </p-card>
</div>
