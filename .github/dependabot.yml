version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
      dev-tools:
        patterns:
          - "eslint*"
          - "prettier*"
          - "vitest*"
          - "@vitest/*"
          - "husky"
          - "lint-staged"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
